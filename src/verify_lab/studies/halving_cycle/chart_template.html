<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반감기 판단 차트</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --halving: #52514e;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --buy: #d63b3a;
  --sell: #1f5fae;
  --band-buy: rgba(214,59,58,0.10);
  --band-sell: rgba(31,95,174,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --halving: #c3c2b7;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --buy: #ff6b6b;
    --sell: #6aa7ff;
    --band-buy: rgba(255,107,107,0.13);
    --band-sell: rgba(106,167,255,0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface-1: #1a1a19;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --halving: #c3c2b7;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --buy: #ff6b6b;
  --sell: #6aa7ff;
  --band-buy: rgba(255,107,107,0.13);
  --band-sell: rgba(106,167,255,0.14);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1320px; margin: 0 auto; padding: 24px 16px 56px; }
h1 { font-size: 22px; margin: 0 0 8px; }
h2 { font-size: 17px; margin: 0 0 6px; }
.lede { color: var(--text-secondary); font-size: 14px; line-height: 1.65; margin: 0; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; margin-top: 20px; }
.chart { width: 100%; }
.table-wrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nowrap { white-space: nowrap; }
th { color: var(--text-secondary); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>반감기_사이클 판단 차트</h1>
  <p class="lede">데이터: <span id="sources"></span> · 만든 시각 <span id="created"></span></p>

  <section class="card">
    <h2>① 반감기 기준 사이클 겹치기</h2>
    <div id="overlay" class="chart"></div>
  </section>

  <section class="card">
    <h2>② 바닥 기준 사이클 겹치기</h2>
    <div id="bottom" class="chart"></div>
  </section>

  <section class="card">
    <h2>③ 전 기간 시간축</h2>
    <div id="timeline" class="chart"></div>
  </section>

  <section class="card">
    <h2>사이클별 숫자표 — 「<span id="split-name"></span>」 <span id="split-rule"></span></h2>
    <div class="table-wrap"><table id="split-table"></table></div>
  </section>

  <section class="card">
    <h2>사이클 요약</h2>
    <div class="table-wrap"><table id="summary-table"></table></div>
  </section>
</main>

<script>__PLOTLY_JS__</script>
<script id="chart-data" type="application/json">__CHART_DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('chart-data').textContent);
  const FONT = 'system-ui, -apple-system, "Segoe UI", sans-serif';
  const CONFIG = { responsive: true, displaylogo: false,
    modeBarButtonsToRemove: ['select2d', 'lasso2d', 'autoScale2d', 'toggleSpikelines'] };
  const MINUS = '−';
  const SPLIT = DATA.split;
  const SIDES = DATA.sides;
  const MULTIPLE_TICKS = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200];
  const PRICE_TICKS = [1, 10, 100, 1000, 10000, 100000];

  // ---------------- 글자 ----------------
  const signed = (v, digits, unit) => v === null || v === undefined ? '—'
    : (v > 0 ? '+' : v < 0 ? MINUS : '') + Math.abs(v).toLocaleString('en-US',
      { minimumFractionDigits: digits, maximumFractionDigits: digits }) + unit;
  const pct = (v) => signed(v, 2, '%');
  const price = (v) => v === null || v === undefined ? '—'
    : '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const span = (first, last) => first === null ? '—' : [first + ' ~', last];

  function tokens() {
    const s = getComputedStyle(document.documentElement);
    const g = (n) => s.getPropertyValue(n).trim();
    return { surface: g('--surface-1'), text: g('--text-primary'), text2: g('--text-secondary'),
      muted: g('--muted'), grid: g('--grid'), axis: g('--axis'), halving: g('--halving'),
      buy: g('--buy'), sell: g('--sell'), bandBuy: g('--band-buy'), bandSell: g('--band-sell'),
      series: [1, 2, 3, 4].map((i) => g('--series-' + i)) };
  }

  function axisStyle(t, extra) {
    return Object.assign({ gridcolor: t.grid, linecolor: t.axis, showline: true, zeroline: false,
      ticks: 'outside', tickcolor: t.axis, tickfont: { color: t.muted, size: 11 },
      title: { font: { color: t.text2, size: 12 }, standoff: 8 } }, extra);
  }

  function baseLayout(t, height, xaxis, yaxis) {
    return { height, paper_bgcolor: t.surface, plot_bgcolor: t.surface,
      font: { family: FONT, color: t.text, size: 12 },
      margin: { l: 70, r: 150, t: 70, b: 52 },
      // 거리를 좁혀, 데이터가 끝난 사이클(진행 중)의 마지막 값이 그 뒤 개월의 호버에 끼지 않게 한다
      hovermode: 'x unified', hoverdistance: 4,
      hoverlabel: { bgcolor: t.surface, bordercolor: t.axis, font: { color: t.text, family: FONT, size: 12 } },
      showlegend: true,
      legend: { orientation: 'h', x: 0, xanchor: 'left', y: 1.0, yanchor: 'bottom', yref: 'paper',
        font: { color: t.text2, size: 12 }, bgcolor: 'rgba(0,0,0,0)' },
      xaxis: axisStyle(t, Object.assign({ showspikes: true, spikemode: 'across', spikesnap: 'hovered data',
        spikecolor: t.muted, spikethickness: 1, spikedash: 'solid' }, xaxis)),
      yaxis: axisStyle(t, yaxis),
      shapes: [], annotations: [] };
  }

  // 로그 세로축 — 값의 범위에서 범위를 잡고 눈금을 「N배」 · 「$N」 으로 단다
  function logAxis(values, ticks, label, title) {
    const known = values.filter((v) => v !== null && v > 0);
    return { type: 'log',
      range: [Math.log10(Math.min(...known)) - 0.08, Math.log10(Math.max(...known)) + 0.12],
      tickvals: ticks, ticktext: ticks.map(label), title: { text: title } };
  }

  // 1배 기준선 — 로그 축에 도형을 두면 축 범위가 무너진다(.claude/rules/charts.md). 선 trace 로 그린다
  function oneLine(t, x0, x1) {
    return { type: 'scatter', mode: 'lines', x: [x0, x1], y: [1, 1], showlegend: false, hoverinfo: 'skip',
      line: { color: t.axis, width: 1 } };
  }

  function band(layout, x0, x1, fill) {
    layout.shapes.push({ type: 'rect', xref: 'x', x0, x1, yref: 'paper', y0: 0, y1: 1,
      fillcolor: fill, line: { width: 0 }, layer: 'below' });
  }

  function bandLabel(t, layout, x, text, color) {
    layout.annotations.push({ xref: 'x', x, yref: 'y domain', y: 1, yanchor: 'top', text, showarrow: false,
      font: { color, size: 11 } });
  }

  // 회차 점 — 매수 ▲ 빨강 · 매도 ▼ 파랑. `pick` 이 그 보기의 가로 · 세로 값을 고른다
  function markerTraces(t, pick) {
    return [[SIDES.buy, 'triangle-up', t.buy], [SIDES.sell, 'triangle-down', t.sell]].map(([side, symbol, color]) => {
      const pts = DATA.points.filter((p) => p.side === side && pick(p)[0] !== null);
      return { type: 'scatter', mode: 'markers', name: side + ' 회차', x: pts.map((p) => pick(p)[0]),
        y: pts.map((p) => pick(p)[1]), marker: { symbol, size: 11, color, line: { color: t.surface, width: 1 } },
        customdata: pts.map((p) => [p.cycle.slice(0, 4), p.tranche, p.date, p.close]),
        hovertemplate: '<b>' + side + ' %{customdata[1]}회차</b> · %{customdata[0]} 사이클 포지션 · '
          + '%{customdata[2]} · $%{customdata[3]:,.2f}<extra></extra>' };
    });
  }

  // ① 의 띠 — 회차 점이 실제로 앉은 자리까지 덮는다. 회차는 그 달의 말일이고(결정 54) 가로축은 날 수를 한 달 평균 길이로
  // 나눈 값이라, 명목 개월 그대로 그리면 회차 점이 최대 한 달 가까이 띠 밖(오른쪽)에 찍혀 「기간 밖에서 샀다」로 읽힌다
  function monthExtent(side, nominal) {
    const xs = DATA.points.filter((p) => p.side === side).map((p) => p.halving_months);
    return [Math.min(nominal[0], ...xs), Math.max(nominal[1], ...xs)];
  }

  // ---------------- ① 반감기 기준 ----------------
  function overlayFigure(t) {
    const maxMonths = Math.ceil(Math.max(...DATA.cycles.map((c) => c.months[c.months.length - 1])) / 3) * 3;
    const layout = baseLayout(t, 560,
      { range: [0, maxMonths], dtick: 3, hoverformat: '.1f', title: { text: '반감기 뒤 경과(개월)' } },
      logAxis(DATA.cycles.flatMap((c) => c.multiple), MULTIPLE_TICKS, (v) => v + '배', '반감기일 대비 배수(로그)'));
    const buy = monthExtent(SIDES.buy, SPLIT.buy);
    const sell = monthExtent(SIDES.sell, SPLIT.sell);
    band(layout, buy[0], buy[1], t.bandBuy);
    band(layout, sell[0], sell[1], t.bandSell);
    bandLabel(t, layout, (buy[0] + buy[1]) / 2, '매수 기간', t.buy);
    bandLabel(t, layout, (sell[0] + sell[1]) / 2, '매도 기간<br>(앞 사이클 포지션)', t.sell);

    const traces = [oneLine(t, 0, maxMonths)];
    DATA.cycles.forEach((c, i) => {
      const custom = c.dates.map((d, k) => [d, c.close[k]]);
      traces.push({ type: 'scatter', mode: 'lines', x: c.months, y: c.multiple, name: c.label,
        line: { color: t.series[i % t.series.length], width: 2 }, customdata: custom,
        hovertemplate: '<b>' + c.label + '</b> %{customdata[0]} · $%{customdata[1]:,.2f} · %{y:.2f}배<extra></extra>' });
      const last = c.months.length - 1;
      layout.annotations.push({ xref: 'x', x: c.months[last], yref: 'y', y: Math.log10(c.multiple[last]),
        xanchor: 'left', xshift: 6, text: c.short, showarrow: false, font: { color: t.text2, size: 12 } });
    });
    return { data: traces.concat(markerTraces(t, (p) => [p.halving_months, p.halving_multiple])), layout };
  }

  // ---------------- ② 바닥 기준 ----------------
  function bottomFigure(t) {
    const lines = DATA.bottoms;
    const minMonths = Math.floor(Math.min(...lines.map((b) => b.months[0])) / 6) * 6;
    const maxMonths = Math.ceil(Math.max(...lines.map((b) => b.months[b.months.length - 1])) / 6) * 6;
    const layout = baseLayout(t, 560,
      { range: [minMonths, maxMonths], dtick: 6, hoverformat: '.1f', title: { text: '바닥 뒤 경과(개월)' } },
      logAxis(lines.flatMap((b) => b.multiple), MULTIPLE_TICKS, (v) => v + '배', '바닥 종가 대비 배수(로그)'));
    layout.shapes.push({ type: 'line', xref: 'x', x0: 0, x1: 0, yref: 'paper', y0: 0, y1: 1,
      line: { color: t.halving, width: 1, dash: 'dot' }, layer: 'below' });
    layout.annotations.push({ xref: 'x', x: 0, yref: 'y domain', y: 1, yanchor: 'top', xanchor: 'left', xshift: 4,
      text: '바닥', showarrow: false, font: { color: t.text2, size: 11 } });

    const traces = [oneLine(t, minMonths, maxMonths)];
    lines.forEach((b, i) => {
      const name = b.halving.slice(0, 4) + ' 사이클 · ' + b.label;
      const custom = b.dates.map((d, k) => [d, b.close[k]]);
      traces.push({ type: 'scatter', mode: 'lines', x: b.months, y: b.multiple, name,
        line: { color: t.series[i % t.series.length], width: 2, dash: b.provisional ? 'dot' : 'solid' },
        customdata: custom,
        hovertemplate: '<b>' + name + '</b> %{customdata[0]} · $%{customdata[1]:,.2f} · %{y:.2f}배<extra></extra>' });
    });
    return { data: traces.concat(markerTraces(t, (p) => [p.bottom_months, p.bottom_multiple])), layout };
  }

  // ---------------- ③ 전 기간 시간축 ----------------
  function timelineFigure(t) {
    const tm = DATA.time;
    const layout = baseLayout(t, 560,
      { type: 'date', hoverformat: '%Y-%m-%d', range: [tm.dates[0], tm.dates[tm.dates.length - 1]] },
      logAxis(tm.close, PRICE_TICKS, (v) => '$' + v.toLocaleString('en-US'), '종가(USD, 로그)'));
    DATA.bands.forEach((b) => band(layout, b.x0, b.x1, b.side === SIDES.buy ? t.bandBuy : t.bandSell));
    DATA.halvings.forEach((d) => {
      layout.shapes.push({ type: 'line', xref: 'x', x0: d, x1: d, yref: 'paper', y0: 0, y1: 1,
        line: { color: t.halving, width: 1 }, layer: 'below' });
      layout.annotations.push({ xref: 'x', x: d, yref: 'y domain', y: 1, yanchor: 'top', xanchor: 'left',
        xshift: 3, text: '반감기 ' + d, showarrow: false, font: { color: t.text2, size: 11 } });
    });
    const line = { type: 'scatter', mode: 'lines', x: tm.dates, y: tm.close, name: '종가',
      line: { color: t.series[0], width: 1.5 }, customdata: tm.anchor,
      hovertemplate: '종가 $%{y:,.2f} · %{customdata}<extra></extra>' };
    return { data: [line].concat(markerTraces(t, (p) => [p.date, p.close])), layout };
  }

  // ---------------- 표 (DOM 은 textContent 로만 채운다) ----------------
  function fillTable(table, headers, rows, numeric) {
    table.replaceChildren();
    const head = table.createTHead().insertRow();
    headers.forEach((h, i) => {
      const th = document.createElement('th');
      th.textContent = h;
      if (numeric[i]) th.className = 'num';
      head.appendChild(th);
    });
    const body = table.createTBody();
    rows.forEach((row) => {
      const tr = body.insertRow();
      row.forEach((value, i) => {
        const td = tr.insertCell();
        // 배열은 한 칸의 여러 줄 — 줄마다 끊지 않아 날짜가 하이픈에서 갈리지 않는다
        if (Array.isArray(value)) {
          value.forEach((part) => {
            const lineEl = document.createElement('div');
            lineEl.className = 'nowrap';
            lineEl.textContent = part;
            td.appendChild(lineEl);
          });
          return;
        }
        td.textContent = value;
        if (numeric[i]) td.className = 'num';
        else if (/^\d{4}-\d{2}-\d{2}$/.test(value)) td.className = 'nowrap';
      });
    });
  }

  function splitTable() {
    const rows = DATA.table.map((r) => [
      r.halving + ' 사이클', span(r.first_buy, r.last_buy), r.buys + '/' + r.buy_tranches, price(r.avg_buy),
      span(r.first_sell, r.last_sell), r.sells + '/' + r.sell_tranches, price(r.avg_sell), pct(r.return), pct(r.worst),
      r.reason === null ? '끝남' : r.reason,
    ]);
    fillTable(document.getElementById('split-table'),
      ['포지션', '산 기간', '산 회차', '평균 매수가', '판 기간', '판 회차', '평균 매도가', '수익률', '평균 단가 대비 최악', '상태'],
      rows, [false, false, true, true, false, true, true, true, true, false]);
  }

  function summaryTable() {
    const day = (d, m) => d + ' (' + m.toFixed(1) + '개월)';
    const rows = DATA.summary.map((r) => [
      r.halving, price(r.base),
      [r.end + ' 까지', '(' + r.end_months.toFixed(1) + '개월' + (r.ongoing ? ', 진행 중' : '') + ')'],
      [day(r.peak, r.peak_months), price(r.peak_close)],
      [day(r.bottom, r.bottom_months) + (r.ongoing ? ' 잠정' : ''), price(r.bottom_close)],
    ]);
    fillTable(document.getElementById('summary-table'),
      ['반감기', '반감기일 종가', '사이클 범위', '가격 고점', '고점 뒤 바닥'], rows, [false, true, false, false, false]);
  }

  function render() {
    const t = tokens();
    [['overlay', overlayFigure], ['bottom', bottomFigure], ['timeline', timelineFigure]].forEach(([id, make]) => {
      const f = make(t);
      Plotly.react(id, f.data, f.layout, CONFIG);
    });
  }

  // 머리 · 채움 글자
  document.getElementById('sources').textContent = DATA.meta.sources
    .map((s) => s.name + ' ' + s.file + ' ' + s.period + ' (' + s.rows.toLocaleString('en-US') + '행)').join(' · ');
  document.getElementById('created').textContent = DATA.meta.created_at;
  document.getElementById('split-name').textContent = SPLIT.name;
  // 폭의 명목 기간 — ① 의 띠는 회차 점이 앉은 자리까지 넓혀 그려 이 값을 읽을 수 없다
  document.getElementById('split-rule').textContent = '매수 반감기 뒤 ' + SPLIT.buy[0] + ' ~ ' + SPLIT.buy[1] + '개월 '
    + SPLIT.buy_tranches + '회 · 매도 다음 반감기 뒤 ' + SPLIT.sell[0] + ' ~ ' + SPLIT.sell[1] + '개월 ' + SPLIT.sell_tranches + '회';

  // 캡처 점검용 주소 표지: #theme=dark
  const hash = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map((p) => p.split('=')));
  if (hash.theme === 'light' || hash.theme === 'dark') document.documentElement.dataset.theme = hash.theme;

  splitTable();
  summaryTable();
  render();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
})();
</script>
</body>
</html>
